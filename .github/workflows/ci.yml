name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13"]

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check apps mailtivo_relay
      - name: Type-check (mypy)
        run: mypy apps mailtivo_relay
        continue-on-error: true  # ratchet up to true blocker once stub coverage is in
      - name: Security (bandit)
        run: |
          find apps mailtivo_relay -type f -name '*.py' ! -path '*/tests/*' -print0 \
            | xargs -0 bandit -q -c pyproject.toml
      - name: Test (pytest)
        # The test settings module mints an ephemeral RELAY_FERNET_KEY at import
        # time, so none needs to be supplied here.
        run: pytest apps -q
      - name: Dependency audit (pip-audit)
        run: pip-audit -r requirements.txt --strict
        continue-on-error: true  # don't block on transitive CVEs we can't immediately patch
