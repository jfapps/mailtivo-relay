{% extends "accounts/_layout.html" %}
{% block title %}Accept invitation · Mailtivo-Relay{% endblock %}
{% block content %}
<div class="space-y-1">
  <h1 class="text-xl font-semibold tracking-tight text-ink">You're invited</h1>
  <p class="text-sm text-muted">Create your account for <span class="code">{{ invitation.email }}</span>.</p>
</div>
<form method="post" class="space-y-4" novalidate>
  {% csrf_token %}
  <div>
    <label class="label" for="id_display_name">Display name <span class="text-faint">(optional)</span></label>
    <input class="input" type="text" name="display_name" id="id_display_name">
  </div>
  <div>
    <label class="label" for="id_password">Password <span class="text-faint">(min 12 characters)</span></label>
    <input class="input" type="password" name="password" id="id_password" required minlength="12">
  </div>
  <div>
    <label class="label" for="id_password_confirm">Confirm password</label>
    <input class="input" type="password" name="password_confirm" id="id_password_confirm" required minlength="12">
  </div>
  <button type="submit" class="btn-primary w-full">Accept invitation</button>
</form>
{% endblock %}
