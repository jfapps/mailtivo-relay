name: Ruff Safe Autofix

on:
  push:
    branches: [fix/ruff-safe-autofix]

permissions:
  contents: write

jobs:
  autofix:
    if: ${{ !contains(github.event.head_commit.message, '[ruff-autofix]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ruff-safe-autofix
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install Ruff
        run: pip install ruff
      - name: Apply safe Ruff fixes
        run: ruff check apps mailtivo_relay --fix || true
      - name: Commit safe fixes
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No safe Ruff changes."
            exit 0
          fi
          git config user.name "JFApps CI"
          git config user.email "120695408+jfapps@users.noreply.github.com"
          git add apps mailtivo_relay
          git commit -m "chore: apply safe Ruff fixes [ruff-autofix]"
          git push origin HEAD:fix/ruff-safe-autofix
