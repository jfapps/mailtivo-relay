# Dev overlay — `docker compose -f docker-compose.yml -f docker-compose.dev.yml up`
# Mounts the source for live reload and runs the dev server instead of gunicorn.
services:
  web:
    command: ["manage", "runserver", "0.0.0.0:8000"]
    environment:
      DJANGO_SETTINGS_MODULE: mailtivo_relay.settings.dev
      DJANGO_DEBUG: "True"
    # Publish the port for direct localhost access during local dev. The base
    # compose only `expose`s it (proxy-only) so hosted deploys don't bind a host
    # port; the overlays are where a host publish belongs.
    ports:
      - "${WEB_PORT:-8000}:8000"
    volumes:
      - .:/app
  worker:
    environment:
      DJANGO_SETTINGS_MODULE: mailtivo_relay.settings.dev
    volumes:
      - .:/app
