services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mailtivo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mailtivo}
      POSTGRES_DB: ${POSTGRES_DB:-mailtivo_relay}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mailtivo} -d ${POSTGRES_DB:-mailtivo_relay}"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-mailtivo}:${POSTGRES_PASSWORD:-mailtivo}@postgres:5432/${POSTGRES_DB:-mailtivo_relay}
      DJANGO_SETTINGS_MODULE: mailtivo_relay.settings.prod
    ports:
      - "${WEB_PORT:-8000}:8000"
    volumes:
      - media:/app/media
      - static:/app/staticfiles
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/healthz/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  worker:
    build: .
    restart: unless-stopped
    command: ["worker"]
    depends_on:
      postgres:
        condition: service_healthy
      web:
        condition: service_started
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-mailtivo}:${POSTGRES_PASSWORD:-mailtivo}@postgres:5432/${POSTGRES_DB:-mailtivo_relay}
      DJANGO_SETTINGS_MODULE: mailtivo_relay.settings.prod

volumes:
  postgres-data:
  media:
  static:
