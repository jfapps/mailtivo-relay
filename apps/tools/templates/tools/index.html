{% extends "panel/base.html" %}
{% block title %}Tools{% endblock %}
{% block topbar_breadcrumb %}<span class="text-faint">/</span><span class="text-sm font-medium text-ink">Tools</span>{% endblock %}
{% block content %}
<div class="space-y-6">
  <header>
    <h1 class="page-title">Tools</h1>
    <p class="page-subtitle">Operator utilities for testing and debugging your relay.</p>
  </header>

  <div class="grid gap-4 sm:grid-cols-2 lg:grid-cols-3">
    <a href="{% url 'tools:test_send' %}" class="card group transition hover:border-brand-300 hover:shadow-sm">
      <div class="card-body space-y-3">
        <span class="inline-flex h-10 w-10 items-center justify-center rounded-lg bg-brand-100 text-brand-700">
          <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </span>
        <div>
          <h2 class="text-sm font-semibold text-ink group-hover:text-brand-700">Test send</h2>
          <p class="mt-1 text-xs text-muted">Send a one-off email through a pool and see the result immediately.</p>
        </div>
      </div>
    </a>
  </div>
</div>
{% endblock %}
