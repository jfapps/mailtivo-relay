services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mailtivo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mailtivo}
      POSTGRES_DB: ${POSTGRES_DB:-mailtivo_relay}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mailtivo} -d ${POSTGRES_DB:-mailtivo_relay}"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-mailtivo}:${POSTGRES_PASSWORD:-mailtivo}@postgres:5432/${POSTGRES_DB:-mailtivo_relay}
      DJANGO_SETTINGS_MODULE: mailtivo_relay.settings.prod
    # No host port publish here: behind Coolify / Traefik (or any reverse proxy)
    # the container is reached over the internal Docker network on the exposed
    # port, so binding 8000 on the host is unnecessary and collides with anything
    # else already using it ("port is already allocated"). `expose` advertises
    # the port to the proxy without publishing it. The dev and prod-local
    # overlays add `ports` back for direct localhost access.
    expose:
      - "8000"
    volumes:
      - media:/app/media
      - static:/app/staticfiles
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/healthz/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  worker:
    build: .
    restart: unless-stopped
    command: ["worker"]
    depends_on:
      postgres:
        condition: service_healthy
      # service_healthy (not service_started): web only turns healthy after its
      # migrate finished, so exactly one process ever runs migrations.
      web:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-mailtivo}:${POSTGRES_PASSWORD:-mailtivo}@postgres:5432/${POSTGRES_DB:-mailtivo_relay}
      DJANGO_SETTINGS_MODULE: mailtivo_relay.settings.prod

volumes:
  postgres-data:
  media:
  static:
